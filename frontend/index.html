<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbofan RUL Cockpit</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #151d2a;
      --line: #2a3445;
      --text: #eef2f8;
      --muted: #a5b3c8;
      --green: #22c55e;
      --yellow: #facc15;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: radial-gradient(circle at 10% -20%, #2a3a52 0%, transparent 45%), var(--bg);
      color: var(--text);
      font-family: "IBM Plex Mono", Menlo, Consolas, monospace;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .header {
      background: linear-gradient(130deg, #111926, #182437);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.3rem;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    .panel {
      background: linear-gradient(160deg, #141d2b, #151d2a);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #e8edf7;
    }

    .gauge {
      width: 100%;
      display: block;
    }

    .readout {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .value-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.01);
    }

    .label {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .big {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .badge.healthy { color: #86efac; background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.45); }
    .badge.moderate { color: #fde68a; background: rgba(250, 204, 21, 0.15); border-color: rgba(250, 204, 21, 0.45); }
    .badge.critical { color: #fca5a5; background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.45); }

    .controls {
      display: grid;
      gap: 10px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      background: linear-gradient(90deg, #f59e0b, #fb923c);
      color: #111827;
    }

    .btn:hover { transform: translateY(-1px); }

    input[type="file"] {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.01);
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
      min-height: 18px;
    }

    .chart-wrap {
      margin-top: 12px;
      height: 220px;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="header">
      <h1>Aircraft Engine Monitoring Console</h1>
      <p class="sub">LSTM RUL + Monte Carlo Dropout uncertainty for predictive maintenance</p>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>RUL Gauge</h2>
        <svg viewBox="0 0 420 250" class="gauge" aria-label="RUL gauge">
          <path d="M 40 200 A 170 170 0 0 1 380 200" fill="none" stroke="#2b3441" stroke-width="22" stroke-linecap="round"></path>
          <path d="M 40 200 A 170 170 0 0 1 153 53" fill="none" stroke="#ef4444" stroke-width="18" stroke-linecap="round"></path>
          <path d="M 153 53 A 170 170 0 0 1 267 53" fill="none" stroke="#facc15" stroke-width="18" stroke-linecap="round"></path>
          <path d="M 267 53 A 170 170 0 0 1 380 200" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round"></path>
          <path id="gauge-fill" d="M 40 200 A 170 170 0 0 1 380 200" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" stroke-dasharray="534" stroke-dashoffset="534"></path>
          <text id="gauge-value" x="210" y="152" text-anchor="middle" fill="#eef2f8" font-size="44" font-weight="700">--</text>
          <text x="210" y="182" text-anchor="middle" fill="#9da7b3" font-size="14">Remaining Useful Life (cycles)</text>
          <text x="36" y="225" fill="#9da7b3" font-size="12">0</text>
          <text x="365" y="225" fill="#9da7b3" font-size="12">125</text>
        </svg>

        <div class="readout">
          <div class="value-card">
            <div class="label">Remaining Useful Life (cycles)</div>
            <div class="big" id="rul-value">--</div>
          </div>
          <div class="value-card">
            <div class="label">Uncertainty</div>
            <div class="big" id="uncertainty-value">+- --</div>
          </div>
          <div class="value-card">
            <div class="label">Engine Status</div>
            <span class="badge moderate" id="status-badge">MODERATE</span>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Inference Controls</h2>
        <div class="controls">
          <button class="btn" id="simulate-btn">Simulate Engine</button>
          <label class="label" for="csv-input">Upload CSV (30 rows x 14 columns)</label>
          <input id="csv-input" type="file" accept=".csv,text/csv" />
          <button class="btn" id="csv-btn">Predict From CSV</button>
          <div class="hint" id="hint">API: http://localhost:8000/predict_rul</div>
        </div>

        <div class="chart-wrap">
          <canvas id="trend-chart"></canvas>
        </div>
      </section>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/predict_rul";
    const SAMPLE_URL = "../data/processed/test_sequences_sample.json";

    const fillPath = document.getElementById("gauge-fill");
    const gaugeValue = document.getElementById("gauge-value");
    const rulValue = document.getElementById("rul-value");
    const uncertaintyValue = document.getElementById("uncertainty-value");
    const statusBadge = document.getElementById("status-badge");
    const hint = document.getElementById("hint");
    const simulateBtn = document.getElementById("simulate-btn");
    const csvBtn = document.getElementById("csv-btn");
    const csvInput = document.getElementById("csv-input");

    let cachedSamples = null;
    let trendChart = null;
    const trendLabels = [];
    const trendValues = [];

    function clamp(value, low, high) {
      return Math.max(low, Math.min(high, value));
    }

    function updateGauge(rul) {
      const clamped = clamp(rul, 0, 125);
      const progress = clamped / 125;
      const pathLength = 534;
      fillPath.style.strokeDashoffset = String(pathLength * (1 - progress));
      gaugeValue.textContent = clamped.toFixed(1);
      rulValue.textContent = `${clamped.toFixed(1)} cycles`;
    }

    function updateStatus(rul) {
      statusBadge.className = "badge";
      if (rul > 80) {
        statusBadge.classList.add("healthy");
        statusBadge.textContent = "HEALTHY";
      } else if (rul >= 40) {
        statusBadge.classList.add("moderate");
        statusBadge.textContent = "MODERATE";
      } else {
        statusBadge.classList.add("critical");
        statusBadge.textContent = "CRITICAL";
      }
    }

    function updateTrend(rul) {
      trendLabels.push(`#${trendLabels.length + 1}`);
      trendValues.push(rul);
      if (trendLabels.length > 15) {
        trendLabels.shift();
        trendValues.shift();
      }
      trendChart.update();
    }

    function initChart() {
      const ctx = document.getElementById("trend-chart");
      trendChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: trendLabels,
          datasets: [{
            label: "Predicted RUL",
            data: trendValues,
            borderColor: "#f59e0b",
            borderWidth: 2,
            tension: 0.25,
            pointRadius: 2,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: "#cfd8e6" } },
          },
          scales: {
            x: { ticks: { color: "#9da7b3" }, grid: { color: "#263244" } },
            y: { ticks: { color: "#9da7b3" }, grid: { color: "#263244" } },
          },
        },
      });
    }

    async function loadSamples() {
      if (cachedSamples) return cachedSamples;
      const response = await fetch(SAMPLE_URL);
      if (!response.ok) {
        throw new Error("Sample data missing. Run preprocessing first.");
      }
      const payload = await response.json();
      cachedSamples = payload.samples;
      return cachedSamples;
    }

    async function callApi(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        throw new Error(await response.text());
      }

      return response.json();
    }

    function applyPrediction(result) {
      updateGauge(result.rul);
      updateStatus(result.rul);
      uncertaintyValue.textContent = `+- ${result.uncertainty.toFixed(2)} cycles`;
      hint.textContent = `95% CI: [${result.confidence_interval_95[0].toFixed(1)}, ${result.confidence_interval_95[1].toFixed(1)}]`;
      updateTrend(result.rul);
    }

    async function runSimulation() {
      simulateBtn.disabled = true;
      simulateBtn.textContent = "Running...";
      try {
        const samples = await loadSamples();
        const idx = Math.floor(Math.random() * samples.length);
        const result = await callApi({ engine_id: idx + 1, sequence: samples[idx] });
        applyPrediction(result);
      } catch (error) {
        hint.textContent = String(error.message || error);
      } finally {
        simulateBtn.disabled = false;
        simulateBtn.textContent = "Simulate Engine";
      }
    }

    async function runCsvPrediction() {
      if (!csvInput.files.length) {
        hint.textContent = "Choose a CSV file first.";
        return;
      }

      csvBtn.disabled = true;
      csvBtn.textContent = "Running...";
      try {
        const text = await csvInput.files[0].text();
        const result = await callApi({ engine_id: 999, csv_data: text });
        applyPrediction(result);
      } catch (error) {
        hint.textContent = String(error.message || error);
      } finally {
        csvBtn.disabled = false;
        csvBtn.textContent = "Predict From CSV";
      }
    }

    initChart();
    updateGauge(62.0);
    updateStatus(62.0);
    simulateBtn.addEventListener("click", runSimulation);
    csvBtn.addEventListener("click", runCsvPrediction);
  </script>
</body>
</html>
