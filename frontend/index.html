<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FD004 RUL Cockpit</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121b2f;
      --line: #293550;
      --text: #edf2ff;
      --muted: #9fb0d1;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: "IBM Plex Mono", Menlo, Consolas, monospace;
      color: var(--text);
      background: radial-gradient(circle at 10% 0%, #23335c 0%, transparent 50%), var(--bg);
    }
    .shell { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
    .head, .panel {
      background: linear-gradient(160deg, #111a2d, #121b2f);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .head h1 { margin: 0 0 6px; font-size: 1.2rem; }
    .head p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
    .row { display: grid; gap: 10px; }
    .value {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      background: rgba(255,255,255,0.01);
    }
    .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 4px; }
    .big { font-size: 1.5rem; font-weight: 700; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      color: #14191f;
      background: linear-gradient(90deg, #f59e0b, #fb923c);
    }
    input[type="file"] {
      width: 100%;
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 8px;
      color: var(--muted);
      background: transparent;
    }
    .hint { color: var(--muted); min-height: 20px; font-size: 0.8rem; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .healthy { color: #86efac; border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.14); }
    .moderate { color: #fde68a; border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.14); }
    .critical { color: #fca5a5; border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.14); }
    .chart { height: 220px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="head">
      <h1>FD004 Engine RUL Console</h1>
      <p>Fresh project reset: only FD004 data, LSTM + MC Dropout uncertainty.</p>
    </section>

    <div class="grid">
      <section class="panel">
        <svg viewBox="0 0 420 250" aria-label="RUL gauge" style="width:100%;display:block">
          <path d="M 40 200 A 170 170 0 0 1 380 200" fill="none" stroke="#2b3441" stroke-width="22" stroke-linecap="round"></path>
          <path d="M 40 200 A 170 170 0 0 1 153 53" fill="none" stroke="#ef4444" stroke-width="18" stroke-linecap="round"></path>
          <path d="M 153 53 A 170 170 0 0 1 267 53" fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"></path>
          <path d="M 267 53 A 170 170 0 0 1 380 200" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round"></path>
          <path id="fill" d="M 40 200 A 170 170 0 0 1 380 200" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" stroke-dasharray="534" stroke-dashoffset="534"></path>
          <text id="gauge" x="210" y="150" text-anchor="middle" fill="#edf2ff" font-size="44" font-weight="700">--</text>
          <text x="210" y="182" text-anchor="middle" fill="#9fb0d1" font-size="14">Predicted RUL (cycles)</text>
          <text x="36" y="225" fill="#9fb0d1" font-size="12">0</text>
          <text x="365" y="225" fill="#9fb0d1" font-size="12">125</text>
        </svg>

        <div class="row">
          <div class="value"><div class="label">RUL</div><div class="big" id="rul">--</div></div>
          <div class="value"><div class="label">Uncertainty</div><div class="big" id="unc">+- --</div></div>
          <div class="value"><div class="label">Status</div><span id="badge" class="badge moderate">MODERATE</span></div>
        </div>
      </section>

      <section class="panel row">
        <button id="simulate" class="btn">Simulate FD004 Engine</button>
        <label class="label" for="csv">Upload CSV (30 rows x 15 columns)</label>
        <input id="csv" type="file" accept=".csv,text/csv" />
        <button id="predictCsv" class="btn">Predict From CSV</button>
        <div id="hint" class="hint">API: http://localhost:8000/predict_rul</div>
        <div class="chart"><canvas id="trend"></canvas></div>
      </section>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/predict_rul";
    const SAMPLE_URL = "../data/processed/test_sequences_sample.json";

    const fill = document.getElementById("fill");
    const gauge = document.getElementById("gauge");
    const rul = document.getElementById("rul");
    const unc = document.getElementById("unc");
    const badge = document.getElementById("badge");
    const hint = document.getElementById("hint");
    const simulateBtn = document.getElementById("simulate");
    const csvBtn = document.getElementById("predictCsv");
    const csvInput = document.getElementById("csv");

    const labels = [];
    const values = [];
    let chart = null;
    let cached = null;

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function setGauge(v) {
      const x = clamp(v, 0, 125);
      const progress = x / 125;
      const len = 534;
      fill.style.strokeDashoffset = String(len * (1 - progress));
      gauge.textContent = x.toFixed(1);
      rul.textContent = `${x.toFixed(1)} cycles`;
    }

    function setStatus(v) {
      badge.className = "badge";
      if (v > 80) { badge.classList.add("healthy"); badge.textContent = "HEALTHY"; }
      else if (v >= 40) { badge.classList.add("moderate"); badge.textContent = "MODERATE"; }
      else { badge.classList.add("critical"); badge.textContent = "CRITICAL"; }
    }

    function pushTrend(v) {
      labels.push(`#${labels.length + 1}`);
      values.push(v);
      if (labels.length > 15) { labels.shift(); values.shift(); }
      chart.update();
    }

    function initChart() {
      chart = new Chart(document.getElementById("trend"), {
        type: "line",
        data: { labels, datasets: [{ label: "Predicted RUL", data: values, borderColor: "#f59e0b", borderWidth: 2, tension: 0.25, pointRadius: 2 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#cbd5e1" } } },
          scales: {
            x: { ticks: { color: "#94a3b8" }, grid: { color: "#273449" } },
            y: { ticks: { color: "#94a3b8" }, grid: { color: "#273449" } },
          },
        },
      });
    }

    async function loadSamples() {
      if (cached) return cached;
      const res = await fetch(SAMPLE_URL);
      if (!res.ok) throw new Error("Sample data missing. Run preprocess first.");
      cached = (await res.json()).samples;
      return cached;
    }

    async function callApi(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function applyResult(r) {
      setGauge(r.rul);
      setStatus(r.rul);
      unc.textContent = `+- ${r.uncertainty.toFixed(2)} cycles`;
      hint.textContent = `95% CI: [${r.confidence_interval_95[0].toFixed(1)}, ${r.confidence_interval_95[1].toFixed(1)}]`;
      pushTrend(r.rul);
    }

    async function simulate() {
      simulateBtn.disabled = true;
      simulateBtn.textContent = "Running...";
      try {
        const samples = await loadSamples();
        const idx = Math.floor(Math.random() * samples.length);
        const result = await callApi({ engine_id: idx + 1, sequence: samples[idx] });
        applyResult(result);
      } catch (err) {
        hint.textContent = String(err.message || err);
      } finally {
        simulateBtn.disabled = false;
        simulateBtn.textContent = "Simulate FD004 Engine";
      }
    }

    async function predictCsv() {
      if (!csvInput.files.length) {
        hint.textContent = "Choose a CSV file first.";
        return;
      }
      csvBtn.disabled = true;
      csvBtn.textContent = "Running...";
      try {
        const text = await csvInput.files[0].text();
        const result = await callApi({ engine_id: 999, csv_data: text });
        applyResult(result);
      } catch (err) {
        hint.textContent = String(err.message || err);
      } finally {
        csvBtn.disabled = false;
        csvBtn.textContent = "Predict From CSV";
      }
    }

    initChart();
    setGauge(62);
    setStatus(62);
    simulateBtn.addEventListener("click", simulate);
    csvBtn.addEventListener("click", predictCsv);
  </script>
</body>
</html>
